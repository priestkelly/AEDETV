<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="https://formspree.io/f/xyewgkrj" method="POST" class="booking-form">

    <input type="hidden" name="_subject" value="New AEDETV Booking Enquiry">

    <!-- Full Name -->
    <div class="form-group">
        <label for="name">Full Name</label>
        <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your full name"
            required
        >
    </div>

    <!-- Email -->
    <div class="form-group">
        <label for="email">Email Address</label>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email address"
            required
        >
    </div>

    <!-- Phone -->
    <div class="form-group">
        <label for="phone">Phone Number</label>
        <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="Enter your phone number"
            required
        >
    </div>

    <!-- Booking Category -->
    <div class="form-group">
        <label for="service">Type of Enquiry</label>
        <select id="service" name="service" required>
            <option value="">Select a service</option>
            <option value="Gospel Music Booking">Gospel Music Booking</option>
            <option value="Video Production">Video Production</option>
            <option value="Comedy and Entertainment">Comedy and Entertainment</option>
            <option value="Media Collaboration">Media Collaboration</option>
            <option value="Other Enquiries">Other Enquiries</option>
        </select>
    </div>

    <!-- Preferred Date -->
    <div class="form-group">
        <label for="date">Preferred Booking Date</label>
        <input
            type="date"
            id="date"
            name="preferred_date"
        >
    </div>

    <!-- Message -->
    <div class="form-group">
        <label for="message">Additional Information</label>
        <textarea
            id="message"
            name="message"
            rows="5"
            placeholder="Tell us more about your booking or enquiry..."
            required
        ></textarea>
    </div>

    <!-- Submit -->
    <button type="submit" class="submit-btn">
        Submit Booking Enquiry
    </button>

</form>
</body>
</html>
